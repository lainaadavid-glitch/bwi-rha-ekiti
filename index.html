<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Sign Up | BWI-RHA Ado LG</title>
<link rel="stylesheet" href="style.css">
<style>
body{margin:0;background:#f4f7f5;min-height:100vh}
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 15px}
.card{width:100%;max-width:460px;background:#fff;padding:35px;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.1)}
.logo{text-align:center;margin-bottom:20px}
.logo img{width:100px;height:100px;object-fit:contain}
h1{text-align:center;margin:5px 0 8px}
.subtitle{text-align:center;color:#666;margin-bottom:28px}
label{display:block;font-weight:700;margin-bottom:7px}
input,select{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px;box-sizing:border-box;margin-bottom:17px}
button{width:100%;padding:14px;border:0;border-radius:8px;background:#16833b;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.message{display:none;margin-top:15px;padding:12px;border-radius:8px}
.message.show{display:block}
.error{background:#fff0f0;color:#a00000}
.success{background:#e8f7ed;color:#12652c}
.links{text-align:center;margin-top:20px}
.links a{color:#16833b;font-weight:700;text-decoration:none}
</style>
</head>

<body>

<div class="auth-page">
<div class="card">

<div class="logo">
<img src="logo.jpeg" alt="BWI-RHA Logo">
</div>

<h1>Member Sign Up</h1>
<p class="subtitle">
Create your BWI-RHA Ado LG member account
</p>

<form id="signupForm">

<label for="fullName">Full Name</label> <input id="fullName" type="text" required>

<label for="email">Email Address</label> <input id="email" type="email" autocomplete="email" required>

<label for="phone">Phone Number</label> <input id="phone" type="tel" required>

<label for="password">Password</label> <input id="password" type="password" minlength="6" required>

<label for="confirmPassword">Confirm Password</label> <input id="confirmPassword" type="password" minlength="6" required>

<button id="signupButton" type="submit">
Create Account
</button>

<div id="message" class="message"></div>

</form>

<div class="links">
Already have an account?
<a href="member-login.html">Sign in</a>
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://xfjrmgendmmpnumsbjte.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qBhmzkK4DDeZk1_pheHgRA_rNKHDKS7";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const form =
document.getElementById("signupForm");

const button =
document.getElementById("signupButton");

const message =
document.getElementById("message");

function showMessage(text,type){
message.textContent=text;
message.className="message show "+type;
}

form.addEventListener("submit",async function(e){

e.preventDefault();

const fullName =
document.getElementById("fullName").value.trim();

const email =
document.getElementById("email").value.trim();

const phone =
document.getElementById("phone").value.trim();

const password =
document.getElementById("password").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

if(password !== confirmPassword){
showMessage("Passwords do not match.","error");
return;
}

button.disabled=true;
button.textContent="Creating account...";

try{

const {data,error} =
await supabaseClient.auth.signUp({
email,
password,
options:{
data:{
full_name:fullName,
phone:phone
}
}
});

if(error) throw error;

if(!data.user){
throw new Error("Account could not be created.");
}

showMessage(
"Account created successfully. You can now sign in.",
"success"
);

setTimeout(()=>{
window.location.href="member-login.html";
},1000);

}catch(error){

console.error(error);

showMessage(
error.message || "Unable to create account.",
"error"
);

}finally{

button.disabled=false;
button.textContent="Create Account";

}

});
</script>

</body>
</html>
