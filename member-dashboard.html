<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>
Member Dashboard | BWI-RHA Ado LG
</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7f5;
    color:#222;
}

.header{
    background:#16833b;
    color:white;
    padding:16px 20px;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:58px;
    height:58px;
    object-fit:contain;
    background:white;
    border-radius:50%;
}

.brand h1{
    margin:0;
    font-size:18px;
}

.brand p{
    margin:4px 0 0;
    font-size:13px;
}

.logout{
    background:white;
    color:#16833b;
    border:0;
    padding:10px 15px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    max-width:850px;
    margin:auto;
    padding:30px 20px;
}

.welcome{
    margin-bottom:25px;
}

.welcome h2{
    margin-bottom:8px;
}

.welcome p{
    color:#666;
}

.card{
    background:white;
    border-radius:16px;
    padding:28px;
    box-shadow:0 7px 25px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.card h3{
    margin-top:0;
    color:#16833b;
}

.status{
    padding:18px;
    border-radius:10px;
    margin-bottom:20px;
}

.pending{
    background:#fff5cc;
    color:#755900;
}

.approved{
    background:#dff6e7;
    color:#12652c;
}

.rejected{
    background:#ffe5e5;
    color:#9a0000;
}

.group{
    margin-bottom:17px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    background:white;
}

input:focus,
select:focus{
    outline:none;
    border-color:#16833b;
}

button.submit{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#16833b;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button.submit:disabled{
    opacity:.6;
}

.message{
    display:none;
    padding:12px;
    border-radius:8px;
    margin-bottom:18px;
    line-height:1.5;
}

.error{
    display:block;
    background:#ffe5e5;
    color:#a00000;
}

.success{
    display:block;
    background:#e1f6e8;
    color:#12652c;
}

.details{
    display:grid;
    gap:0;
}

.detail{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:13px 0;
    border-bottom:1px solid #eee;
}

.detail strong{
    color:#555;
}

.detail span{
    text-align:right;
    font-weight:bold;
}

@media(max-width:600px){

    .header-inner{
        align-items:flex-start;
    }

    .brand h1{
        font-size:15px;
    }

    .container{
        padding:20px 15px;
    }

    .card{
        padding:20px;
    }

    .detail{
        flex-direction:column;
        gap:5px;
    }

    .detail span{
        text-align:left;
    }

}

</style>

</head>

<body>

<header class="header">

<div class="header-inner">

<div class="brand">

<img
src="logo.jpeg"
class="logo"
alt="BWI-RHA Logo"

>

<div>

<h1>
BWI-RHA EKITI STATE CHAPTER
</h1>

<p>
ADO LOCAL GOVERNMENT
</p>

</div>

</div>

<button
id="logoutButton"
class="logout"

>

Logout </button>

</div>

</header>

<main class="container">

<div class="welcome">

<h2 id="welcomeName">
Member Dashboard
</h2>

<p>
Complete your registration below.
Your registration will be reviewed by the administrator.
</p>

</div>

<div
    id="message"
    class="message"
></div>

<!-- REGISTRATION FORM -->

<div
    id="registrationCard"
    class="card"
    style="display:none;"
>

<h3>
Complete Your Registration
</h3>

<form id="registrationForm">

<div class="group">

<label for="fullName">
Full Name
</label>

<input
id="fullName"
type="text"
required

>

</div>

<div class="group">

<label for="phone">
Phone Number
</label>

<input
id="phone"
type="tel"
required

>

</div>

<div class="group">

<label for="ward">
Ward
</label>

<select
id="ward"
required

>

<option value="">
Select your ward
</option>

<option value="1">Ward 1</option>
<option value="2">Ward 2</option>
<option value="3">Ward 3</option>
<option value="4">Ward 4</option>
<option value="5">Ward 5</option>
<option value="6">Ward 6</option>
<option value="7">Ward 7</option>
<option value="8">Ward 8</option>
<option value="9">Ward 9</option>
<option value="10">Ward 10</option>
<option value="11">Ward 11</option>
<option value="12">Ward 12</option>
<option value="13">Ward 13</option>

</select>

</div>

<div class="group">

<label for="bankName">
Bank Name
</label>

<input
id="bankName"
type="text"
placeholder="Enter bank name"

>

</div>

<div class="group">

<label for="accountName">
Account Name
</label>

<input
id="accountName"
type="text"
placeholder="Enter account name"

>

</div>

<div class="group">

<label for="accountNumber">
Account Number
</label>

<input
id="accountNumber"
type="text"
inputmode="numeric"
maxlength="20"
placeholder="Enter account number"

>

</div>

<div class="group">

<label for="pollingBooth">
Polling Booth
</label>

<input
id="pollingBooth"
type="text"
placeholder="Enter polling booth"

>

</div>

<button
id="submitButton"
class="submit"
type="submit"

>

Submit Registration </button>

</form>

</div>

<!-- PENDING/APPROVED INFORMATION -->

<div
    id="statusCard"
    class="card"
    style="display:none;"
>

<h3>
Registration Status
</h3>

<div
    id="statusBox"
    class="status"
></div>

<div
    id="memberDetails"
    class="details"
></div>

</div>

</main>

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script>

const SUPABASE_URL =
"https://xfjrmgendmmpnumsbjte.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qBhmzkK4DDeZk1_pheHgRA_rNKHDKS7";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const registrationCard =
document.getElementById(
    "registrationCard"
);

const statusCard =
document.getElementById(
    "statusCard"
);

const statusBox =
document.getElementById(
    "statusBox"
);

const memberDetails =
document.getElementById(
    "memberDetails"
);

const message =
document.getElementById(
    "message"
);

const welcomeName =
document.getElementById(
    "welcomeName"
);


function showMessage(
    text,
    type
){

    message.textContent=text;

    message.className=
        "message "+type;

}


function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ================================
   CHECK LOGIN
================================ */

async function initialize(){

    const {
        data:{
            user
        }
    } =
    await supabaseClient.auth.getUser();


    if(!user){

        window.location.href=
            "member-login.html";

        return;

    }


    const fullName =
        user.user_metadata?.full_name ||
        "Member";


    welcomeName.textContent =
        `Welcome, ${fullName}`;


    await loadRegistration(user);

}


/* ================================
   LOAD MEMBER RECORD
================================ */

async function loadRegistration(user){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("members")
        .select("*")
        .eq(
            "auth_user_id",
            user.id
        )
        .maybeSingle();


    if(error){

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

        return;

    }


    if(!data){

        registrationCard.style.display=
            "block";

        statusCard.style.display=
            "none";


        document.getElementById(
            "fullName"
        ).value =
            user.user_metadata?.full_name ||
            "";


        document.getElementById(
            "phone"
        ).value =
            user.user_metadata?.phone ||
            "";


        return;

    }


    registrationCard.style.display=
        "none";

    statusCard.style.display=
        "block";


    showRegistrationStatus(data);

}


/* ================================
   SHOW STATUS
================================ */

function showRegistrationStatus(member){

    const status =
        member.status;


    if(status === "pending"){

        statusBox.className=
            "status pending";

        statusBox.innerHTML=
            "<strong>🟡 Pending Registration</strong><br><br>" +
            "Your registration has been submitted and is waiting for administrator approval.";

    }


    else if(status === "approved"){

        statusBox.className=
            "status approved";

        statusBox.innerHTML=
            "<strong>🟢 Approved</strong><br><br>" +
            "Congratulations! Your BWI-RHA membership has been approved.";

    }


    else if(status === "rejected"){

        statusBox.className=
            "status rejected";

        statusBox.innerHTML=
            "<strong>🔴 Registration Rejected</strong><br><br>" +
            "Your registration was not approved. Please contact the administrator.";

    }


    memberDetails.innerHTML=`

        <div class="detail">
            <strong>Full Name</strong>
            <span>
                ${escapeHTML(member.full_name)}
            </span>
        </div>

        <div class="detail">
            <strong>Phone</strong>
            <span>
                ${escapeHTML(member.phone)}
            </span>
        </div>

        <div class="detail">
            <strong>Ward</strong>
            <span>
                Ward ${escapeHTML(member.ward_id)}
            </span>
        </div>

        <div class="detail">
            <strong>Bank Name</strong>
            <span>
                ${escapeHTML(member.bank_name || "Not provided")}
            </span>
        </div>

        <div class="detail">
            <strong>Account Name</strong>
            <span>
                ${escapeHTML(member.account_name || "Not provided")}
            </span>
        </div>

        <div class="detail">
            <strong>Account Number</strong>
            <span>
                ${escapeHTML(member.account_number || "Not provided")}
            </span>
        </div>

        <div class="detail">
            <strong>Polling Booth</strong>
            <span>
                ${escapeHTML(member.polling_booth || "Not provided")}
            </span>
        </div>

        <div class="detail">
            <strong>EXCO Position</strong>
            <span>
                ${escapeHTML(member.exco_position || "Not assigned")}
            </span>
        </div>

    `;

}


/* ================================
   SUBMIT REGISTRATION
================================ */

document
.getElementById("registrationForm")
.addEventListener(
"submit",
async(event)=>{

    event.preventDefault();


    const {
        data:{
            user
        }
    } =
    await supabaseClient.auth.getUser();


    if(!user){

        window.location.href=
            "member-login.html";

        return;

    }


    const fullName =
        document
        .getElementById("fullName")
        .value.trim();


    const phone =
        document
        .getElementById("phone")
        .value.trim();


    const ward =
        Number(
            document
            .getElementById("ward")
            .value
        );


    const bankName =
        document
        .getElementById("bankName")
        .value.trim();


    const accountName =
        document
        .getElementById("accountName")
        .value.trim();


    const accountNumber =
        document
        .getElementById("accountNumber")
        .value.trim();


    const pollingBooth =
        document
        .getElementById("pollingBooth")
        .value.trim();


    if(
        !fullName ||
        !phone ||
        !ward
    ){

        showMessage(
            "Please complete your name, phone number and ward.",
            "error"
        );

        return;

    }


    if(
        ward < 1 ||
        ward > 13
    ){

        showMessage(
            "Please select a valid ward from Ward 1 to Ward 13.",
            "error"
        );

        return;

    }


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    submitButton.disabled=true;

    submitButton.textContent=
        "Submitting...";


    const {
        data:existing,
        error:findError
    } =
    await supabaseClient
        .from("members")
        .select("id,status")
        .eq(
            "auth_user_id",
            user.id
        )
        .maybeSingle();


    if(findError){

        showMessage(
            findError.message,
            "error"
        );

        submitButton.disabled=false;
        submitButton.textContent=
            "Submit Registration";

        return;

    }


    let result;


    if(existing){

        /*
         * Update an existing registration.
         * A rejected member can resubmit.
         */

        result =
        await supabaseClient
            .from("members")
            .update({

                full_name:fullName,

                phone:phone,

                ward_id:ward,

                bank_name:bankName || null,

                account_name:accountName || null,

                account_number:accountNumber || null,

                polling_booth:pollingBooth || null,

                status:"pending",

                reviewed_at:null

            })
            .eq(
                "id",
                existing.id
            );

    }else{

        /*
         * Create the member record.
         *
         * id is generated by the database.
         * auth_user_id connects the record
         * to the logged-in Supabase user.
         */

        result =
        await supabaseClient
            .from("members")
            .insert({

                full_name:fullName,

                phone:phone,

                email:user.email,

                ward_id:ward,

                bank_name:bankName || null,

                account_name:accountName || null,

                account_number:accountNumber || null,

                polling_booth:pollingBooth || null,

                status:"pending",

                auth_user_id:user.id

            });

    }


    if(result.error){

        console.error(
            result.error
        );

        showMessage(
            result.error.message,
            "error"
        );

        submitButton.disabled=false;
        submitButton.textContent=
            "Submit Registration";

        return;

    }


    showMessage(
        "Registration submitted successfully. Your status is now Pending.",
        "success"
    );


    setTimeout(
        ()=>{

            loadRegistration(user);

        },
        800
    );

});


/* ================================
   LOGOUT
================================ */

document
.getElementById("logoutButton")
.addEventListener(
"click",
async()=>{

    await supabaseClient.auth.signOut();

    window.location.href=
        "index.html";

});


/* ================================
   START
================================ */

initialize();

</script>

</body>
</html>
