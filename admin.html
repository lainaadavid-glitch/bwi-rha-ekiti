<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BWI-RHA | Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #222;
}

button,
input,
select {
    font: inherit;
}

.hidden {
    display: none !important;
}

/* =========================
   LOGIN
========================= */

#loginScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;

    background:
        linear-gradient(
            135deg,
            #071b12,
            #0d5c38
        );
}

.login-box {
    width: 100%;
    max-width: 430px;
    background: white;
    border-radius: 18px;
    padding: 35px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.login-logo {
    width: 90px;
    height: 90px;
    object-fit: contain;
    display: block;
    margin: 0 auto 15px;
}

.login-box h1 {
    text-align: center;
    color: #075c35;
    margin-bottom: 8px;
}

.login-box p {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 9px;
    outline: none;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #087443;
}

/* =========================
   BUTTONS
========================= */

.btn {
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: bold;
}

.btn:hover {
    opacity: .9;
}

.btn-primary {
    background: #087443;
    color: white;
}

.btn-success {
    background: #168447;
    color: white;
}

.btn-danger {
    background: #c62828;
    color: white;
}

.btn-warning {
    background: #e99b00;
    color: white;
}

.btn-secondary {
    background: #6c757d;
    color: white;
}

.btn-block {
    width: 100%;
}

/* =========================
   ERROR
========================= */

.error {
    background: #ffe5e5;
    color: #b00020;
    padding: 11px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-size: 14px;
}

/* =========================
   DASHBOARD
========================= */

#dashboard {
    min-height: 100vh;
}

.topbar {
    background: #075c35;
    color: white;

    min-height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 12px 25px;

    gap: 15px;
    flex-wrap: wrap;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand img {
    width: 48px;
    height: 48px;
    object-fit: contain;
}

.brand h2 {
    font-size: 19px;
}

.brand small {
    display: block;
    opacity: .8;
    margin-top: 3px;
}

.admin-info {
    display: flex;
    align-items: center;
    gap: 12px;
}

.admin-email {
    font-size: 13px;
    opacity: .9;
}

.logout-btn {
    background: #b91c1c;
    color: white;
    border: none;
    border-radius: 7px;
    padding: 9px 13px;
    cursor: pointer;
    font-weight: bold;
}

/* =========================
   NAV
========================= */

.nav {
    background: white;
    border-bottom: 1px solid #ddd;

    display: flex;
    overflow-x: auto;

    padding: 0 20px;
}

.nav button {
    background: transparent;
    border: none;

    padding: 16px 20px;

    cursor: pointer;
    font-weight: bold;
    color: #555;

    white-space: nowrap;

    border-bottom: 3px solid transparent;
}

.nav button.active {
    color: #075c35;
    border-bottom-color: #075c35;
}

/* =========================
   CONTENT
========================= */

.content {
    max-width: 1450px;
    margin: auto;
    padding: 25px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;
    margin-bottom: 20px;

    flex-wrap: wrap;
}

.page-header h2 {
    color: #075c35;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));

    gap: 15px;

    margin-bottom: 25px;
}

.stat-card {
    background: white;
    border-radius: 12px;
    padding: 20px;

    box-shadow:
        0 2px 10px rgba(0,0,0,.06);
}

.stat-card h3 {
    font-size: 30px;
    color: #075c35;
    margin-bottom: 5px;
}

.stat-card p {
    color: #777;
}

/* =========================
   CARD
========================= */

.card {
    background: white;

    border-radius: 12px;

    padding: 20px;

    box-shadow:
        0 2px 10px rgba(0,0,0,.06);

    margin-bottom: 20px;
}

.toolbar {
    display: flex;
    gap: 10px;

    margin-bottom: 15px;

    flex-wrap: wrap;
}

.search {
    flex: 1;

    min-width: 220px;

    padding: 11px;

    border: 1px solid #ccc;

    border-radius: 8px;
}

/* =========================
   TABLE
========================= */

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;

    border-collapse: collapse;

    min-width: 850px;
}

th,
td {
    padding: 12px;

    border-bottom:
        1px solid #eee;

    text-align: left;

    vertical-align: middle;
}

th {
    background: #f7f9f8;

    color: #075c35;

    font-size: 13px;
}

td {
    font-size: 14px;
}

tr:hover td {
    background: #fafafa;
}

/* =========================
   BADGES
========================= */

.badge {
    display: inline-block;

    padding: 5px 9px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;
}

.badge-approved {
    background: #d9f7e6;
    color: #087443;
}

.badge-pending {
    background: #fff0c2;
    color: #946200;
}

.badge-declined {
    background: #ffe0e0;
    color: #b00020;
}

.badge-admin {
    background: #e0ecff;
    color: #2457a6;
}

/* =========================
   ACTIONS
========================= */

.actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.actions .btn {
    padding: 7px 9px;
    font-size: 12px;
}
