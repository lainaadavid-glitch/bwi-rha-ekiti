<script>
/* =========================================================
   SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
    "https://xfjrmgendmmpnumsbjte.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_qBhmzkK4DDeZk1_pheHgRA_rNKHDKS7";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   SINGLE ADMIN ACCESS
   ONLY THESE TWO EMAILS CAN ENTER THE ADMIN DASHBOARD
========================================================= */

const ALLOWED_ADMIN_EMAILS = [
    "agatha4jesu@gmail.com",
    "adalumofelicia@gmail.com"
];


/* =========================================================
   LOGIN
========================================================= */

const loginForm =
    document.getElementById("loginForm");

const loginError =
    document.getElementById("loginError");


loginForm.addEventListener("submit", async function (event) {

    event.preventDefault();

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim()
            .toLowerCase();

    const password =
        document
            .getElementById("loginPassword")
            .value;


    loginError.classList.add("hidden");
    loginError.textContent = "";


    /* Check allowed email first */

    if (!ALLOWED_ADMIN_EMAILS.includes(email)) {

        loginError.textContent =
            "Access denied. This email is not authorized as an administrator.";

        loginError.classList.remove("hidden");

        return;
    }


    showLoading(true);


    try {

        const {
            data,
            error
        } = await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


        if (error) {
            throw error;
        }


        if (!data || !data.user) {

            throw new Error(
                "Login failed. No user account was returned."
            );
        }


        /* Double-check the authenticated email */

        const loggedInEmail =
            data.user.email
                .trim()
                .toLowerCase();


        if (
            !ALLOWED_ADMIN_EMAILS.includes(
                loggedInEmail
            )
        ) {

            await supabaseClient.auth.signOut();

            throw new Error(
                "This account is not authorized to access the admin dashboard."
            );
        }


        /* Show dashboard */

        document
            .getElementById("loginScreen")
            .classList.add("hidden");


        document
            .getElementById("dashboard")
            .classList.remove("hidden");


        const adminEmail =
            document.getElementById("adminEmail");

        if (adminEmail) {
            adminEmail.textContent =
                loggedInEmail;
        }


        /* Load existing data */

        if (typeof loadEverything === "function") {
            await loadEverything();
        }


        showToast(
            "Login successful.",
            "success"
        );


    } catch (error) {

        console.error(
            "Login error:",
            error
        );


        loginError.textContent =
            error.message ||
            "Unable to login. Please check your email and password.";


        loginError.classList.remove("hidden");


    } finally {

        showLoading(false);

    }

});


/* =========================================================
   LOGOUT
========================================================= */

const logoutBtn =
    document.getElementById("logoutBtn");


if (logoutBtn) {

    logoutBtn.addEventListener(
        "click",
        async function () {

            showLoading(true);

            await supabaseClient.auth.signOut();

            document
                .getElementById("dashboard")
                .classList.add("hidden");

            document
                .getElementById("loginScreen")
                .classList.remove("hidden");

            document
                .getElementById("loginPassword")
                .value = "";

            showLoading(false);

        }
    );

}


/* =========================================================
   CHECK EXISTING SESSION
========================================================= */

async function checkSession() {

    try {

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();


        if (error) {
            console.error(
                "Session error:",
                error
            );

            return;
        }


        const session =
            data.session;


        if (!session || !session.user) {
            return;
        }


        const email =
            session.user.email
                .trim()
                .toLowerCase();


        /* Existing session must also belong to an allowed admin */

        if (
            !ALLOWED_ADMIN_EMAILS.includes(email)
        ) {

            await supabaseClient.auth.signOut();

            return;
        }


        document
            .getElementById("loginScreen")
            .classList.add("hidden");


        document
            .getElementById("dashboard")
            .classList.remove("hidden");


        const adminEmail =
            document.getElementById("adminEmail");

        if (adminEmail) {
            adminEmail.textContent =
                email;
        }


        if (typeof loadEverything === "function") {
            await loadEverything();
        }


    } catch (error) {

        console.error(
            "Session check failed:",
            error
        );

    }

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(show) {

    const loading =
        document.getElementById("loading");

    if (!loading) return;

    if (show) {
        loading.classList.add("show");
    } else {
        loading.classList.remove("show");
    }

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message,
    type = ""
) {

    const toast =
        document.getElementById("toast");

    if (!toast) return;

    toast.textContent = message;

    toast.className = "";

    toast.id = "toast";

    toast.classList.add("show");

    if (type) {
        toast.classList.add(type);
    }


    setTimeout(function () {

        toast.classList.remove("show");

    }, 3500);

}


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        checkSession();

    }
);

</script>
