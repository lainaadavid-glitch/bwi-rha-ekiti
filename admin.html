<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | BWI-RHA Ekiti State Chapter</title>

<style>
:root{
    --green:#16833b;
    --dark-green:#17351f;
    --light-green:#e9f7ef;
    --very-light:#f6faf7;
    --white:#fff;
    --black:#172018;
    --gray:#66736a;
    --border:#dce8df;
    --gold:#d4a72c;
    --blue:#2878b8;
    --danger:#6b5555;
    --shadow:0 10px 30px rgba(0,80,40,.10);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--very-light);
    color:var(--black);
    line-height:1.6;
}

button,input,select{font:inherit}

button{cursor:pointer}

a{text-decoration:none}

.site-header{
    background:white;
    border-bottom:4px solid var(--green);
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.header-container{
    width:min(1200px,94%);
    min-height:82px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--black);
}

.site-logo{
    width:58px;
    height:58px;
    object-fit:contain;
}

.logo-text h1{
    margin:0;
    color:var(--green);
    font-size:19px;
    line-height:1.2;
}

.logo-text p{
    margin:3px 0 0;
    color:var(--dark-green);
    font-weight:bold;
}

.main-nav{
    display:flex;
    gap:6px;
}

.main-nav a{
    color:var(--black);
    padding:10px 13px;
    border-radius:8px;
    font-weight:600;
}

.main-nav a:hover,
.main-nav a.active{
    background:var(--green);
    color:white;
}

.menu-btn{
    display:none;
    border:0;
    background:var(--green);
    color:white;
    padding:10px 14px;
    border-radius:8px;
    font-size:22px;
}

.container{
    width:min(1150px,92%);
    margin:auto;
}

.login-page{
    min-height:calc(100vh - 160px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:50px 20px;
}

.login-box{
    width:100%;
    max-width:480px;
    background:white;
    border:2px solid var(--border);
    border-top:6px solid var(--green);
    border-radius:18px;
    padding:35px;
    box-shadow:var(--shadow);
}

.login-logo{
    width:80px;
    height:80px;
    object-fit:contain;
    display:block;
    margin:0 auto 15px;
}

.login-title{
    text-align:center;
    margin-bottom:28px;
}

.login-title h2{
    margin:0;
    color:var(--dark-green);
    font-size:28px;
}

.login-title p{
    margin:7px 0 0;
    color:var(--gray);
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:700;
    color:var(--dark-green);
}

.form-group input,
.form-group select{
    width:100%;
    padding:14px 15px;
    border:2px solid var(--border);
    border-radius:10px;
    background:white;
    color:var(--black);
    outline:none;
}

.form-group input:focus,
.form-group select:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(22,131,59,.10);
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:var(--green);
    color:white;
    font-weight:700;
    font-size:16px;
}

.login-btn:hover{
    background:var(--dark-green);
}

.login-btn:disabled{
    opacity:.65;
    cursor:wait;
}

.message{
    margin-top:15px;
    padding:12px 14px;
    border-radius:9px;
    display:none;
    font-weight:600;
}

.message.show{display:block}

.message.info{
    background:#eef6fb;
    color:#185477;
    border:1px solid #c8dfed;
}

.message.success{
    background:var(--light-green);
    color:var(--dark-green);
    border:1px solid #b9e1c7;
}

#adminDashboard{display:none}

.dashboard{
    padding:45px 0 70px;
}

.dashboard-header{
    background:var(--dark-green);
    color:white;
    border-radius:18px;
    padding:28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:25px;
    box-shadow:var(--shadow);
}

.dashboard-header h2{
    margin:0 0 5px;
    font-size:28px;
}

.dashboard-header p{
    margin:0;
    opacity:.9;
}

.logout-btn{
    border:2px solid white;
    background:white;
    color:var(--dark-green);
    padding:10px 18px;
    border-radius:9px;
    font-weight:700;
}

.logout-btn:hover{
    background:var(--light-green);
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:30px;
}

.stat-card{
    background:white;
    border:2px solid var(--border);
    border-radius:15px;
    padding:25px;
    text-align:center;
    box-shadow:var(--shadow);
}

.stat-icon{
    font-size:30px;
}

.stat-card h3{
    margin:0;
    color:var(--green);
    font-size:36px;
}

.stat-card p{
    margin:4px 0 0;
    color:var(--gray);
    font-weight:600;
}

.admin-section{
    background:white;
    border:2px solid var(--border);
    border-radius:16px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:var(--shadow);
}

.admin-section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.admin-section h2{
    margin:0;
    color:var(--dark-green);
}

.refresh-btn,
.primary-btn{
    border:0;
    background:var(--green);
    color:white;
    padding:10px 16px;
    border-radius:8px;
    font-weight:700;
}

.refresh-btn:hover,
.primary-btn:hover{
    background:var(--dark-green);
}

.filter-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.filter-row select,
.filter-row input{
    min-width:220px;
    padding:12px;
    border:2px solid var(--border);
    border-radius:9px;
    outline:none;
}

.filter-row select:focus,
.filter-row input:focus{
    border-color:var(--green);
}

.members-list{
    display:grid;
    gap:15px;
}

.member-card{
    border:1px solid var(--border);
    border-left:5px solid var(--green);
    border-radius:12px;
    padding:20px;
    background:var(--very-light);
}

.member-card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    margin-bottom:12px;
}

.member-card h3{
    margin:0;
    color:var(--dark-green);
}

.member-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px 20px;
    margin-bottom:15px;
}

.member-info div{
    color:var(--gray);
}

.member-info strong{
    color:var(--black);
}

.status-badge{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
}

.status-pending{
    background:#fff6d8;
    color:#745c00;
}

.status-approved{
    background:var(--light-green);
    color:var(--dark-green);
}

.status-declined{
    background:#eef1ef;
    color:#46534a;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.action-btn{
    border:0;
    padding:10px 16px;
    border-radius:8px;
    font-weight:700;
}

.approve-btn{
    background:var(--green);
    color:white;
}

.decline-btn{
    background:#eef1ef;
    color:var(--dark-green);
    border:1px solid var(--border);
}

.delete-btn{
    background:#e7
