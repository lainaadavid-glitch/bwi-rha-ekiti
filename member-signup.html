<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script>


const SUPABASE_URL =
    "https://xfjrmgendmmpnumsbjte.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_qBhmzkK4DDeZk1_pheHgRA_rNKHDKS7";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const form =
    document.getElementById(
        "signupForm"
    );


const button =
    document.getElementById(
        "signupButton"
    );


const message =
    document.getElementById(
        "message"
    );


function showMessage(
    text,
    type
) {

    message.textContent = text;

    message.className =
        `message ${type}`;

}


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const fullName =
            document
                .getElementById("fullName")
                .value
                .trim();


        const phone =
            document
                .getElementById("phone")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        if (
            password !==
            confirmPassword
        ) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;

        }


        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;

        }


        button.disabled = true;

        button.textContent =
            "Creating Account...";


        try {


            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            full_name:
                                fullName,

                            phone:
                                phone

                        }

                    }

                });


            if (error) {

                throw error;

            }


            /*
             * If email confirmation is enabled,
             * Supabase may not immediately create
             * an authenticated session.
             */

            if (!data.user) {

                throw new Error(
                    "Account could not be created."
                );

            }


            /*
             * Create the member profile.
             *
             * IMPORTANT:
             * This requires your members table
             * RLS policy to allow the authenticated
             * user to insert their own record.
             */

            const {
                error: memberError
            } =
                await supabaseClient
                    .from("members")
                    .insert({

                        id:
                            data.user.id,

                        full_name:
                            fullName,

                        phone:
                            phone,

                        email:
                            email,

                        status:
                            "pending"

                    });


            if (memberError) {

                console.error(
                    memberError
                );

                showMessage(
                    "Account created, but your member profile could not be created. Please contact the administrator.",
                    "error"
                );

                button.disabled = false;

                button.textContent =
                    "Create Account";

                return;

            }


            showMessage(
                "Account created successfully! Redirecting to your dashboard...",
                "success"
            );


            setTimeout(
                function() {

                    window.location.href =
                        "member-dashboard.html";

                },
                1500
            );


        }

        catch(error) {

            console.error(error);

            showMessage(
                error.message ||
                "Unable to create account.",
                "error"
            );

            button.disabled = false;

            button.textContent =
                "Create Account";

        }

    });


</script>
