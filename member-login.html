<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Member Login | BWI-RHA Ado LG</title>
<link rel="stylesheet" href="style.css">

<style>
body{margin:0;background:#f4f7f5;min-height:100vh}
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 15px}
.card{width:100%;max-width:450px;background:#fff;padding:35px;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.1)}
.logo{text-align:center;margin-bottom:20px}
.logo img{width:100px;height:100px;object-fit:contain}
h1{text-align:center;margin:5px 0 8px}
.subtitle{text-align:center;color:#666;margin-bottom:28px}
label{display:block;font-weight:700;margin-bottom:7px}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px;box-sizing:border-box;margin-bottom:20px}
button{width:100%;padding:14px;border:0;border-radius:8px;background:#16833b;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.message{display:none;margin-top:15px;padding:12px;border-radius:8px}
.message.show{display:block}
.error{background:#fff0f0;color:#a00000}
.links{text-align:center;margin-top:20px}
.links a{color:#16833b;font-weight:700;text-decoration:none}
</style>

</head>

<body>

<div class="auth-page">
<div class="card">

<div class="logo">
<img src="logo.jpeg" alt="BWI-RHA Logo">
</div>

<h1>Member Login</h1>

<p class="subtitle">
BWI-RHA Ado Local Government
</p>

<form id="loginForm">

<label for="email">Email Address</label>
<input
id="email"
type="email"
autocomplete="email"
required

>

<label for="password">Password</label>
<input
id="password"
type="password"
autocomplete="current-password"
required

>

<button id="loginButton" type="submit">
Sign In
</button>

<div id="message" class="message"></div>

</form>

<div class="links">
Don't have an account?
<a href="member-signup.html">Create Account</a>
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://xfjrmgendmmpnumsbjte.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qBhmzkK4DDeZk1_pheHgRA_rNKHDKS7";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const form =
document.getElementById("loginForm");

const button =
document.getElementById("loginButton");

const message =
document.getElementById("message");

function showMessage(text,type){
message.textContent=text;
message.className="message show "+type;
}

form.addEventListener("submit",async function(e){

e.preventDefault();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

button.disabled=true;
button.textContent="Signing in...";

try{

const {data,error} =
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error) throw error;

if(!data.session){
throw new Error("Unable to create login session.");
}

window.location.href="member-dashboard.html";

}catch(error){

console.error(error);

showMessage(
error.message || "Login failed.",
"error"
);

}finally{

button.disabled=false;
button.textContent="Sign In";

}

});

async function checkSession(){

const {data} =
await supabaseClient.auth.getSession();

if(data.session){
window.location.href="member-dashboard.html";
}

}

checkSession();
</script>

</body>
</html>
