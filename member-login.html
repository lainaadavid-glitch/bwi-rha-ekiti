<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>
Member Login | BWI-RHA Ado LG
</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7f5;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:450px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 12px 40px rgba(0,0,0,.12);
}

.logo{
    display:block;
    width:100px;
    height:100px;
    object-fit:contain;
    margin:0 auto 20px;
}

h1{
    text-align:center;
    color:#17351f;
    margin:0;
}

.subtitle{
    text-align:center;
    color:#666;
    margin:10px 0 25px;
}

.group{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#16833b;
}

button{
    width:100%;
    padding:14px;
    background:#16833b;
    color:white;
    border:0;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.message{
    display:none;
    padding:12px;
    border-radius:8px;
    margin-bottom:18px;
    line-height:1.5;
}

.error{
    display:block;
    background:#ffe5e5;
    color:#a00000;
}

.success{
    display:block;
    background:#e1f6e8;
    color:#12652c;
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    color:#16833b;
    font-weight:bold;
    text-decoration:none;
}

.back{
    display:block;
    text-align:center;
    margin-top:15px;
    color:#777;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="card">

<img
src="logo.jpeg"
alt="BWI-RHA Logo"
class="logo"

>

<h1>
Member Login
</h1>

<p class="subtitle">
BWI-RHA Ado Local Government
</p>

<div
    id="message"
    class="message"
></div>

<form id="loginForm">

<div class="group">

<label for="email">
Email Address
</label>

<input
id="email"
type="email"
required
placeholder="Enter your email"

>

</div>

<div class="group">

<label for="password">
Password
</label>

<input
id="password"
type="password"
required
placeholder="Enter your password"

>

</div>

<button
id="loginButton"
type="submit"

>

Login </button>

</form>

<div class="links">

Don't have an account?

<a href="member-signup.html">
Sign Up
</a>

</div>

<a
href="index.html"
class="back"

>

← Back to Home </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://xfjrmgendmmpnumsbjte.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qBhmzkK4DDeZk1_pheHgRA_rNKHDKS7";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const form =
document.getElementById("loginForm");

const button =
document.getElementById("loginButton");

const message =
document.getElementById("message");

function showMessage(text,type){

    message.textContent=text;
    message.className=
        "message "+type;

}

form.addEventListener(
"submit",
async(event)=>{

    event.preventDefault();

    const email =
    document.getElementById("email").value.trim();

    const password =
    document.getElementById("password").value;

    button.disabled=true;
    button.textContent="Signing In...";

    const {data,error} =
    await supabaseClient.auth.signInWithPassword({

        email:email,
        password:password

    });

    if(error){

        showMessage(
            error.message,
            "error"
        );

        button.disabled=false;
        button.textContent="Login";

        return;
    }

    showMessage(
        "Login successful. Opening dashboard...",
        "success"
    );

    setTimeout(()=>{

        window.location.href=
        "member-dashboard.html";

    },700);

});

</script>

</body>
</html>
